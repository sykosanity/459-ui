<script>


(function(){
  if (window.__m459PublicPeekInstalled) return;
  window.__m459PublicPeekInstalled=true;
  const style=document.createElement('style');
  style.id='m459-public-peek-style';
  style.textContent=`
#m459-player-peek{position:fixed;left:620px;top:240px;width:318px;max-width:calc(100vw - 20px);z-index:9991;
  padding:0 0 10px;display:none;box-sizing:border-box;pointer-events:none;border:1px solid rgba(171,125,209,.42);
  border-radius:7px;background:linear-gradient(150deg,rgba(21,19,29,.95),rgba(9,10,17,.95));
  box-shadow:0 16px 45px rgba(0,0,0,.36),0 0 16px rgba(148,63,204,.14);

#m459-player-peek .peek-title{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:15px;color:#fbf8ff;}
#m459-player-peek .peek-id{font-size:10px;color:#bda5d6;font-weight:700;}
#m459-player-peek .peek-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 14px;min-height:27px;}
#m459-player-peek .peek-label{color:#9996aa;font-weight:750;font-size:10px;letter-spacing:.6px;white-space:nowrap;}
#m459-player-peek .peek-value{color:#ece8f5;font-weight:650;font-size:11px;text-align:right;overflow:hidden;text-overflow:ellipsis;}
#m459-player-peek .peek-alive{color:#74e5a7;}
#m459-player-peek .peek-section{padding:12px 14px 5px;margin-top:3px;font-weight:800;color:#b49acb;font-size:9px;letter-spacing:1.5px;}
#m459-player-peek .peek-bar{height:6px;border-radius:8px;background:#2e293a;overflow:hidden;margin:0 14px 7px;}
#m459-player-peek .peek-bar > span{display:block;height:100%;border-radius:8px;transition:width 110ms linear;}
#m459-player-peek .peek-bar.health>span{background:linear-gradient(90deg,#8a55d4,#ba81ff)}
#m459-player-peek .peek-bar.armor>span{background:linear-gradient(90deg,#417ba9,#84d9ff)}
#m459-player-peek .peek-foot{margin:6px 14px 0;padding-top:9px;border-top:1px solid rgba(160,145,179,.19);font-size:9px;color:#8e899d;}

body.m459-on-home #menu-path{display:none!important}
#m459-player-peek .peek-bar > span{transition:width 90ms linear}

`;
  document.head.appendChild(style);
  const p=document.createElement('aside');p.id='m459-player-peek';
  p.setAttribute('aria-label','Selected player status');
  const rows=(label,key,extra='')=>`<div class="peek-row"><span class="peek-label">${label}</span><span class="peek-value ${extra}" data-k="${key}">—</span></div>`;
  p.innerHTML=`<div class="peek-head"><span class="peek-marker"></span><span class="peek-title" data-k="name">Player</span><span class="peek-id" data-k="sid"></span></div>
    ${rows('STATUS','status','peek-alive')}
    <div class="peek-section">VITALS</div>${rows('HEALTH','health')}<div class="peek-bar health"><span style="width:0%"></span></div>
    ${rows('ARMOR','armor')}<div class="peek-bar armor"><span style="width:0%"></span></div>
    <div class="peek-section">SESSION</div>
    ${rows('SPEED','speed')}${rows('DISTANCE','distance')}${rows('COORDS','coords')}
    ${rows('JOB','job')}${rows('GRADE','grade')}${rows('RADIO CHANNEL','radio')}
    ${rows('PHONE','phone')}
    `;
  document.body.appendChild(p);
  const fields={}; for(const e of p.querySelectorAll('[data-k]'))fields[e.dataset.k]=e;
  const healthFill=p.querySelector('.peek-bar.health>span'),armorFill=p.querySelector('.peek-bar.armor>span');
  let visibleInGame=true;
  let lastData=null;
  const string=(v)=>String(v===undefined||v===null?'—':v);
  const clamp=(n)=>Math.max(0,Math.min(100,Number(n)||0));
  function position(){
    const menu=document.getElementById('menu-root');if(!menu)return;
    const r=menu.getBoundingClientRect(),w=p.offsetWidth||318,h=p.offsetHeight||480;
    let x=r.right+14;if(x+w>innerWidth-12)x=Math.max(10,r.left-w-14);
    const y=Math.max(10,Math.min(innerHeight-h-10,r.top+180));
    const left=Math.round(x)+'px',top=Math.round(y)+'px';
    if(p.style.left!==left)p.style.left=left;
    if(p.style.top!==top)p.style.top=top;
  }
  function show(d){
    lastData=d;
    if(!d||!d.visible||!visibleInGame){p.style.display='none';return}
    for(const key of ['name','sid','status','health','armor','speed','distance','coords','job','grade','radio','phone']){
      const value=string(d[key]);if(fields[key].textContent!==value)fields[key].textContent=value;
    }
    const hp=clamp(d.healthPercent)+'%',ap=clamp(d.armorPercent)+'%';
    if(healthFill.style.width!==hp)healthFill.style.width=hp;
    if(armorFill.style.width!==ap)armorFill.style.width=ap;
    const wasHidden=p.style.display!=='block';
    if(wasHidden)p.style.display='block';
    if(wasHidden)position();
  }
  window.addEventListener('message',ev=>{
    const d=ev.data;
    if(!d||typeof d!=='object')return;
    if(d.action==='m459PlayerPeek'){show(d);return}
    if(d.action==='m459HudMode'){
      visibleInGame=d.menuVisible!==false;
      if(!visibleInGame)p.style.display='none';
      else if(lastData&&lastData.visible)show(lastData);
      return;
    }
    if(d.action==='m459Position')position();
  });
  window.addEventListener('resize',position);
  window.M459PlayerPeek={show,position,hide:()=>show({visible:false})};
})();

</script>

<script>

(function(){
  const host=window.M459Nexus;
  if(!host||!host.state)return;
  const state=host.state;
  const tab=state.tabs.find(t=>t.label==='Online');
  if(!tab)return;
  const sample=[
    {sid:101,name:'Demo Player One',health:95,armor:72,dist:32,job:'Police Officer',grade:'Sergeant',radio:'3',phone:'555-0101'},
    {sid:102,name:'Demo Player Two',health:71,armor:12,dist:74,job:'Paramedic',grade:'Senior',radio:'Unavailable',phone:'555-0102'},
    {sid:103,name:'Demo Player Three',health:100,armor:100,dist:112,job:'Unavailable',grade:'—',radio:'Not connected',phone:'Unavailable'},
  ];
  const slots=tab.items.filter(r=>r.group==='Nearby Players'&&r.type==='action'&&/^#\d|^\s*$/.test(r.label||''));
  for(let i=0;i<Math.min(sample.length,slots.length);i++){
    const r=sample[i],slot=slots[i];
    slot.label='#'+(i+1)+'  ['+r.sid+'] '+r.name+'  '+r.dist+'m';
  }
  host.setData({tabs:state.tabs});
  const push=()=>{
    if(state.setup||state.level!==2||state.tabs[state.tab-1]?.label!=='Online'){
      window.M459PlayerPeek?.hide();return;
    }
    const row=state.tabs[state.tab-1]?.items?.[state.focus-1];
    const match=sample.find(s=>row?.label?.includes('['+s.sid+']'));
    if(!match){window.M459PlayerPeek?.hide();return;}
    window.M459PlayerPeek?.show({action:'m459PlayerPeek',visible:true,
      name:match.name+' · DEMO',sid:'['+match.sid+']',status:'Alive',health:match.health+'%',healthPercent:match.health,
      armor:match.armor+'%',armorPercent:match.armor,speed:'0.0 km/h',distance:match.dist+' m',
      coords:'— (demo)',job:match.job,grade:match.grade,radio:match.radio,phone:match.phone});
  };
  document.addEventListener('keydown',()=>requestAnimationFrame(push));
  setInterval(()=>{
    if(state.setup||state.level!==2||state.tabs[state.tab-1]?.label!=='Online')return;
    for(const player of sample){
      player.dist=Math.max(5,Math.round(player.dist+Math.sin(Date.now()/800+player.sid)*2));
    }
    push();
  },350);
  push();
})();
</script>

<script id="m459-original-look-click-controls">
(function(){
  const M=window.M459Nexus;
  if(!M || !M.state) return;
  const S=M.state;
  const list=document.getElementById('menu-items');
  const tabs=document.getElementById('sub-tabs');
  const backNodes=['menu-banner','invite-line','footer-left','path-back'];
  function back(){ if(S.setup||S.editing)return; M.back(); }
  for(const id of backNodes){
    const el=document.getElementById(id);
    if(!el) continue;
    el.style.cursor='pointer';
    el.title='Back to main categories';
    el.addEventListener('click',back);
  }
  if(list){
    list.addEventListener('click',function(e){
      const row=e.target.closest('.menu-item');
      if(!row || !list.contains(row) || S.setup)return;
      if(row.dataset.type==='status' || row.dataset.type==='divider')return;
      const n=Number(row.dataset.index);
      if(!Number.isInteger(n)||n<1)return;
      if(S.level===0) S.catPick=n;
      else S.focus=n;
      M.enter();
    });
    // Browser-only affordance, doesn't change original layout/color/size.
    const style=document.createElement('style');
    style.textContent='#menu-items .menu-item:not(.note-row):not(.preview-row),#sub-tabs .subtab{cursor:pointer}';
    document.head.appendChild(style);
  }
  if(tabs)tabs.addEventListener('click',function(e){
    if(S.level!==2||S.setup||S.editing)return;
    const item=e.target.closest('[data-group]');
    if(!item||!tabs.contains(item))return;
    const target=Number(item.dataset.group);
    if(Number.isInteger(target))M.shiftGroup(target-S.group);
  });
  // Preview-only indication of what was clicked. No FiveM game actions are run.
  window.M459BrowserPreview=true;
})();
</script>
